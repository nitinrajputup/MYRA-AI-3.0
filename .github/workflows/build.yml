
name: MYRA AI 3.0 APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Gradle Project
        run: |
          FILE=$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build MYRA AI APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA_AI_3.0_APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
